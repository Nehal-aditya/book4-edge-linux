# CAMSS exposes 16 raw V4L2 nodes ("Qualcomm Camera Subsystem") that carry no usable
# image; apps enumerate them first and pick one. Hide them so only the libcamera
# device ("Built-in Front Camera") is offered.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name = "~v4l2_device.platform_acb6000.isp.*"
      }
      {
        node.name = "~v4l2_input.platform_acb6000.isp.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
