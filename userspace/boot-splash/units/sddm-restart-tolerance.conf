# Stock sddm.service has StartLimitBurst=2 in 30 s with RestartSec=100ms. If anything
# holds DRM master when the greeter starts, sddm fails permanently: black screen, no
# display manager, no getty (sddm conflicts with getty@tty1). Make that cosmetic.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSec=2s
