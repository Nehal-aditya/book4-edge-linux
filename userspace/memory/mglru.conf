# MGLRU, the kernel's multi-generation page reclaim (needs CONFIG_LRU_GEN; see
# config/README.md). min_ttl_ms=1000 is the kernel documentation's value against
# thrashing: when the last second of the working set cannot stay in memory, the OOM
# killer stops one process instead of the desktop freezing. "y" turns on every MGLRU
# feature this CPU supports. The "-" after "w" ignores kernels built without MGLRU.
w- /sys/kernel/mm/lru_gen/enabled - - - - y
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
