# Book4 Edge speaker EQ + limiter.
#
# The amps have no free gain (every hardware lever is already at maximum) and clip
# hard above about -10 dBFS input, so loudness is a crest-factor problem: the
# limiter raises the average and keeps peaks below the amp's knee, as the Windows
# DSP does. Values were measured acoustically at 400 Hz: +15 dB input gain with
# limit 0 reaches within ~1 dB of the physical ceiling at under 3 % THD.
#
# Chain: app -> [this] -> book4_speakers_aec -> hardware. The canceller must stay
# closest to the hardware (see 62-*.conf).
#
# VISENSE (thermal/excursion feedback) is off on these amps. If it sounds strained
# or the speakers get hot, lower "Input gain" first; it is tunable at runtime:
#   pw-cli s <sink-id> Props '{ params = [ "lim:Input gain (dB)" 12.0 ] }'
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers (tuned)"
      media.name       = "Speakers (tuned)"
      filter.graph = {
        nodes = [
          # 160 Hz high-pass: nothing usable below ~200 Hz, and it makes the limiter duck.
          { type = builtin label = bq_highpass  name = hpL1 control = { "Freq" = 160 "Q" = 0.707 } }
          { type = builtin label = bq_highpass  name = hpL2 control = { "Freq" = 160 "Q" = 0.707 } }
          # +4 dB at 300 Hz: measured 12-20 dB down through 250-500 Hz.
          { type = builtin label = bq_peaking   name = eqL1 control = { "Freq" = 300  "Q" = 0.9 "Gain" = 4.0 } }
          # -4 dB at 800 Hz: measured +7 dB hump.
          { type = builtin label = bq_peaking   name = eqL2 control = { "Freq" = 800  "Q" = 1.2 "Gain" = -4.0 } }
          { type = builtin label = bq_highshelf name = eqL3 control = { "Freq" = 6000 "Q" = 0.707 "Gain" = 2.0 } }

          { type = builtin label = bq_highpass  name = hpR1 control = { "Freq" = 160 "Q" = 0.707 } }
          { type = builtin label = bq_highpass  name = hpR2 control = { "Freq" = 160 "Q" = 0.707 } }
          { type = builtin label = bq_peaking   name = eqR1 control = { "Freq" = 300  "Q" = 0.9 "Gain" = 4.0 } }
          { type = builtin label = bq_peaking   name = eqR2 control = { "Freq" = 800  "Q" = 1.2 "Gain" = -4.0 } }
          { type = builtin label = bq_highshelf name = eqR3 control = { "Freq" = 6000 "Q" = 0.707 "Gain" = 2.0 } }

          { type   = ladspa
            plugin = "/usr/lib/ladspa/fast_lookahead_limiter_1913.so"
            label  = "fastLookaheadLimiter"
            name   = lim
            control = {
              "Input gain (dB)"  = 15.0
              "Limit (dB)"       = 0.0
              "Release time (s)" = 0.15
            }
          }
        ]
        links = [
          { output = "hpL1:Out" input = "hpL2:In" }
          { output = "hpL2:Out" input = "eqL1:In" }
          { output = "eqL1:Out" input = "eqL2:In" }
          { output = "eqL2:Out" input = "eqL3:In" }
          { output = "eqL3:Out" input = "lim:Input 1" }

          { output = "hpR1:Out" input = "hpR2:In" }
          { output = "hpR2:Out" input = "eqR1:In" }
          { output = "eqR1:Out" input = "eqR2:In" }
          { output = "eqR2:Out" input = "eqR3:In" }
          { output = "eqR3:Out" input = "lim:Input 2" }
        ]
        inputs  = [ "hpL1:In"      "hpR1:In"      ]
        outputs = [ "lim:Output 1" "lim:Output 2" ]
      }
      capture.props = {
        node.name      = "book4_speakers_tuned"
        media.class    = Audio/Sink
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "playback.book4_speakers_tuned"
        node.target    = "book4_speakers_aec"
        audio.position = [ FL FR ]
        node.passive   = true
      }
    }
  }
]
