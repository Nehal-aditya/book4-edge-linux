# Acoustic echo cancellation for speakerphone calls.
#
# Chain:   app -> book4_speakers_tuned (EQ) -> book4_speakers_aec -> hardware
#          mic -> book4_mic_aec (echo removed) -> app
#
# The canceller must sit closest to the hardware so its reference is what the
# speakers actually emit: 31.8 dB suppression measured this way, 5.8 dB with the
# EQ after it. gain_control is off: AGC boosts the residual and pumps.
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name  = aec/libspa-aec-webrtc
      monitor.mode  = false
      aec.args = {
        webrtc.gain_control        = false
        webrtc.extended_filter     = true
        webrtc.noise-suppression   = true
        webrtc.high-pass-filter    = true
        webrtc.voice-detection     = false
        webrtc.analog-gain-control = false
      }
      capture.props = {
        node.target = "alsa_input.platform-sound.HiFi__Mic__source"
      }
      source.props = {
        node.name        = "book4_mic_aec"
        node.description = "Internal microphones (echo cancelled)"
      }
      sink.props = {
        node.name        = "book4_speakers_aec"
        node.description = "Speakers (echo cancelled)"
      }
      playback.props = {
        node.target = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    }
  }
]
