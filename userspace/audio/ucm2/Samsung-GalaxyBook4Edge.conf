Syntax 4

# Samsung Galaxy Book4 Edge 15.6 (NP750XQA, X1P42100): two WSA883x speakers on one
# WSA macro, WCD9385 headset codec, VA-macro digital mics. No DisplayPort audio links.
# Modelled on Qualcomm/x1e80100/LENOVO-T14s.conf (same topology with WSA884x amps).

SectionUseCase."HiFi" {
	File "/conf.d/x1e80100/Samsung-GalaxyBook4Edge-HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa883x/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
