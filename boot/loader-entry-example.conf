# /boot/loader/entries/book4.conf  (systemd-boot; the machine boots with efi=noruntime)
title      Arch Linux (Galaxy Book4 Edge)
linux      /vmlinuz-book4.efi
initrd     /initramfs-book4.img
devicetree /dtbs/x1p42100-samsung-galaxy-book4-edge-np750xqa.dtb
options    root=PARTUUID=<your-root-partuuid> rw clk_ignore_unused pd_ignore_unused efi=noruntime quiet loglevel=2
